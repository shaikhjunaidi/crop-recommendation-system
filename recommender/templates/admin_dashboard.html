{% extends "base.html" %}
{% load static %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<div class="container-fluid">

    <h3 class="mb-4">
        <i class="fa-solid fa-gauge"></i>
        Admin Dashboard
    </h3>

    <!-- Statistics Cards -->
    <div class="row g-4 mb-4">

        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted">Users</div>
                        <h2 class="fw-bold">{{ total_users }}</h2>
                    </div>
                    <i class="fa-solid fa-users fa-3x text-success"></i>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted">Predictions</div>
                        <h2 class="fw-bold">{{ total_predictions }}</h2>
                    </div>
                    <i class="fa-solid fa-seedling fa-3x text-success"></i>
                </div>
            </div>
        </div>

    </div>

    <!-- Charts -->
    <div class="row g-4">

        <!-- Bar Chart -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body" style="height:380px;">
                    <h5 class="mb-3">
                        <i class="fa-solid fa-chart-column"></i>
                        Top Recommended Crops
                    </h5>

                    <canvas id="cropBar"></canvas>
                </div>
            </div>
        </div>

        <!-- Line Chart -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body" style="height:380px;">
                    <h5 class="mb-3">
                        <i class="fa-solid fa-chart-line"></i>
                        Predictions (Last 7 Days)
                    </h5>

                    <canvas id="dayLine"></canvas>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const cropLabels = {{ crop_labels|safe }};
const cropCounts = {{ crop_count|safe }};

const dayLabels = {{ day_labels|safe }};
const dayCounts = {{ day_counts|safe }};

function createChart(id, config){

    const oldChart = Chart.getChart(id);

    if(oldChart){
        oldChart.destroy();
    }

    const canvas = document.getElementById(id);

    if(canvas){
        new Chart(canvas, config);
    }
}

/* =======================
      BAR CHART
======================= */

createChart("cropBar",{

    type:"bar",

    data:{
        labels:cropLabels,

        datasets:[{

            label:"Predictions",

            data:cropCounts,

            backgroundColor:"#198754",

            borderRadius:8

        }]
    },

    options:{

        responsive:true,

        maintainAspectRatio:false,

        plugins:{
            legend:{
                display:false
            }
        },

        scales:{
            y:{
                beginAtZero:true,
                ticks:{
                    precision:0
                }
            }
        }

    }

});


/* =======================
      LINE CHART
======================= */

createChart("dayLine",{

    type:"line",

    data:{

        labels:dayLabels,

        datasets:[{

            label:"Predictions",

            data:dayCounts,

            borderColor:"#198754",

            backgroundColor:"rgba(25,135,84,0.2)",

            fill:true,

            tension:0.35,

            pointRadius:4,

            pointHoverRadius:6

        }]

    },

    options:{

        responsive:true,

        maintainAspectRatio:false,

        plugins:{
            legend:{
                display:false
            }
        },

        scales:{
            y:{
                beginAtZero:true,
                ticks:{
                    precision:0
                }
            }
        }

    }

});

</script>

{% endblock %}
